name: Performance Test

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  # A run started by a comment is tied to master, so we dispatch a separate run on the pull request's branch.
  trigger:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test_performance')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMENTER: ${{ github.event.comment.user.login }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Dispatch performance test on the pull request's branch
        run: |
          perm=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" -q .permission) || perm=none
          if [[ ! "$perm" =~ ^(admin|write)$ ]]; then
            echo "::error::$COMMENTER is not allowed to run performance tests (permission=$perm)"
            exit 1
          fi

          read -r cross ref sha < <(gh pr view "$PR_NUMBER" --json isCrossRepository,headRefName,headRefOid \
            -q '"\(.isCrossRepository) \(.headRefName) \(.headRefOid)"')
          if [[ "$cross" != "false" ]]; then
            echo "::error::Performance tests cannot be run for a pull request from a fork"
            exit 1
          fi

          ahead=$(gh run list --workflow performance.yml --event workflow_dispatch --json status \
            -q '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          gh workflow run performance.yml --ref "$ref"
          gh api "repos/$GH_REPO/statuses/$sha" -f state=pending -f context=performance \
            -f description="Queued behind $ahead other run(s)" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/workflows/performance.yml?query=branch:$ref"

  performance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: performance
    steps:
      # The benchmark containers run as root, so we need to take their files back before checkout can clean the workspace.
      - name: Reclaim workspace ownership
        run: docker run --rm -v $PWD:/root/app membraneframeworklabs/docker_membrane chown -R $(id -u):$(id -g) /root/app

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Back up benchmark and mix.exs
        run: |
          cp -r benchmark/ $HOME/benchmark_backup/
          cp mix.exs $HOME/benchmark_backup/

      - name: Pull Docker image
        run: docker pull membraneframeworklabs/docker_membrane

      - name: Run benchmarks on feature branch
        run: |
          mkdir -p $HOME/results
          docker run \
            -e MIX_ENV=benchmark \
            -v $PWD:/root/app \
            -v $HOME/results:/root/results \
            -w /root/app \
            membraneframeworklabs/docker_membrane \
            mix do deps.get, deps.compile --force --all, compile --force, run benchmark/run.exs /root/results/feature_branch_results

      - name: Switch to master and restore benchmark
        run: |
          git fetch --depth 1 origin master
          git checkout -f FETCH_HEAD
          cp $HOME/benchmark_backup/mix.exs .

      - name: Run benchmarks on master
        run: |
          docker run \
            -e MIX_ENV=benchmark \
            -v $PWD:/root/app \
            -v $HOME/results:/root/results \
            -v $HOME/benchmark_backup/benchmark:/root/app/benchmark \
            -w /root/app \
            membraneframeworklabs/docker_membrane \
            mix do deps.get, deps.compile --force --all, compile --force, run benchmark/run.exs /root/results/master_results

      - name: Compare results
        run: |
          docker run \
            -e MIX_ENV=benchmark \
            -v $PWD:/root/app \
            -v $HOME/results:/root/results \
            -v $HOME/benchmark_backup/benchmark:/root/app/benchmark \
            -w /root/app \
            membraneframeworklabs/docker_membrane \
            mix run benchmark/compare.exs /root/results/feature_branch_results /root/results/master_results

      - name: Clean up results
        if: always()
        run: rm -f $HOME/results/*

  # Checks of a dispatched run are not shown on the pull request, so we report the result as a commit status.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: performance
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATE: ${{ needs.performance.result == 'success' && 'success' || 'failure' }}
    steps:
      - name: Report the result on the tested commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=$STATE -f context=performance \
            -f description="Performance test: ${{ needs.performance.result }}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
